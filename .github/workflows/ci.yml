name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  sabotage:
    name: Sabotage — Stage 0 trust suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      # Offline by design: no API keys are provided. The suite must run with no
      # real LLM or network access. `--runxfail` is intentionally NOT passed —
      # strict xfail means a Stage 0 feature landing without dropping its marker
      # turns the unexpected pass into a CI failure, forcing the marker removal.
      - name: Run sabotage suite
        run: uv run pytest tests/sabotage -q --tb=short

  novelty-ci-lite:
    name: Novelty — ci-lite benchmark (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      # Offline by design: no API keys. The S2-7 novelty engine plumbing
      # (recall -> prefilter -> differentiate -> falsify) is exercised on 5 KNOWN
      # + 3 PLAUSIBLE fixture rows with canned outputs; every prediction must
      # match ground truth or the harness exits non-zero. Quality numbers are
      # NOT asserted here (that is the full live run, CC-2.7).
      - name: Run novelty ci-lite
        run: uv run python -m benchmarks.novelty.run_novelty_bench --ci-lite

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
